[rest]
server_ip=
server_port=8003

[opc]
classname=Graybox.OPC.DAWrapper
host=128.100.1.21
servers=Yokogawa.ExaopcDAEXQ.1
# Optional: comma-separated names of additional OPC servers to fail over to
# (in order) whenever this primary is down -- reads AND writes fail over.
# Each name needs its own section below with at least `host`; `classname`/
# `servers` fall back to the primary's above if omitted, since the common
# case is the same OPC server program reachable at a different address.
# Only appropriate when a write via any of these servers reaches the same
# real destination as a write via the primary -- see README's Operations
# section.
#failover=secondary

#[secondary]
#host=128.100.1.22

[preferences]
show_root=False

[logging]
# trace/debug/info/warning/error/critical.
# info (the default): connection lost/restored, periodic "still unreachable"
#   lines during an outage, and every write (state-changing) with its result.
# debug: adds per-request REST/business-level call detail (params and result
#   counts for list/read/properties/etc) and per-attempt reconnect detail.
# trace: adds OpenOPC's own low-level per-COM-call tracing (AddGroup,
#   SyncRead, RemoveGroup, Connect, ...) -- very verbose, several lines per
#   request; use only when debug isn't enough to see what's going wrong.
level=info

