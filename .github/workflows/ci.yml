name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    # Linux only, deliberately: the REST/business logic layer (ApiFunctions,
    # ApiServers) never touches win32com directly and is fully unit-testable
    # here with a mocked OPC client. The vendored OpenOPC.py's actual COM
    # automation can only be exercised against a real OPC server on Windows
    # -- see README's Development / Testing section -- so there's nothing a
    # Windows CI runner (with no OPC server attached) could verify beyond
    # what's already covered, and pywin32 isn't installable here anyway.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff check)
        run: ruff check .

      - name: Format check (ruff format)
        run: ruff format --check .

      - name: Test
        run: pytest -q
